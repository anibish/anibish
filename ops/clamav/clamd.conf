Foreground yes
TCPSocket 3310
TCPAddr 0.0.0.0
LocalSocket /run/clamav/clamd.sock
LocalSocketMode 660
DatabaseDirectory /var/lib/clamav
TemporaryDirectory /tmp
User clamav
MaxThreads 1
MaxQueue 4
ReadTimeout 30
CommandReadTimeout 10
SendBufTimeout 500
StreamMaxLength 12M
MaxFileSize 12M
MaxScanSize 64M
MaxRecursion 12
MaxFiles 2000
MaxScanTime 25000
AlertExceedsMax yes
AlertEncrypted yes
AlertEncryptedArchive yes
AlertEncryptedDoc yes
ScanArchive yes
ScanPE yes
ScanELF yes
ScanOLE2 yes
ScanPDF yes
ScanHTML yes
ScanMail yes
Bytecode yes
BytecodeSecurity TrustSigned
BytecodeUnsigned no
SelfCheck 300
ConcurrentDatabaseReload no
LogClean no
LogVerbose no
LeaveTemporaryFiles no
