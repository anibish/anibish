name: anibish
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: anibish
      POSTGRES_USER: anibish
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a unique PostgreSQL password}
    volumes:
      - anibish_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U anibish -d anibish"]
      interval: 5s
      timeout: 5s
      retries: 20
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - anibish_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
  migrate:
    build:
      context: .
      dockerfile: api/Dockerfile
    command: ["./node_modules/.bin/tsx", "api/migrate.ts"]
    environment:
      DATABASE_URL: postgresql://anibish:${POSTGRES_PASSWORD}@postgres:5432/anibish
    depends_on:
      postgres:
        condition: service_healthy
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://anibish:${POSTGRES_PASSWORD}@postgres:5432/anibish
      REDIS_URL: redis://redis:6379
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:3000}
      MFA_ENCRYPTION_KEY: ${MFA_ENCRYPTION_KEY:?Set 32 random bytes encoded as hex}
      SANDBOX_PAYMENT_SECRET: ${SANDBOX_PAYMENT_SECRET:?Set a unique sandbox signing secret}
      PAYMENT_MODE: sandbox
      STORAGE_DIR: /app/storage
    volumes:
      - anibish_files:/app/storage
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 5
  web:
    build:
      context: .
      args:
        API_INTERNAL_URL: http://api:3001
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 5
volumes:
  anibish_postgres: {}
  anibish_redis: {}
  anibish_files: {}
